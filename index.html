<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الزبائن - Tobal Flexy</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="customer_style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <div class="logo-area">
                <i class="fas fa-bolt"></i>
                <h2>بوابة الزبائن</h2>
                <p>مرحباً بك في منصة الشحن السريع</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>رابط السيرفر (اختياري للسحابة)</label>
                    <div class="input-icon">
                        <i class="fas fa-server"></i>
                        <input type="text" id="server-url" placeholder="http://192.168.x.x:3005">
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="btn-login">تسجيل الدخول <i class="fas fa-sign-in-alt"></i></button>
            </form>
            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen">
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fas fa-bolt"></i> Tobal Flexy
            </div>
            <div class="nav-user">
                <span id="user-name-display">محمد</span>
                <button onclick="logout()" class="btn-logout" title="تسجيل الخروج"><i class="fas fa-power-off"></i></button>
            </div>
        </nav>

        <div class="container">
            <!-- Balance Card -->
            <div class="balance-card">
                <div class="balance-header">رصيدك الحالي</div>
                <div class="balance-amount"><span id="user-balance">0.00</span> <small>دج</small></div>
                <button class="btn-refresh" onclick="fetchProfile()"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>

            <!-- Flexy Form -->
            <div class="action-card">
                <h3><i class="fas fa-mobile-alt"></i> إرسال فليكسي</h3>
                <form id="flexy-form">
                    <div class="operator-selector" id="operator-selector">
                        <div class="operator-option" data-op="mobilis">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Mobilis_Logo.svg" alt="Mobilis">
                            <span>Mobilis</span>
                        </div>
                        <div class="operator-option" data-op="djezzy">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/Djezzy_Logo.svg" alt="Djezzy">
                            <span>Djezzy</span>
                        </div>
                        <div class="operator-option" data-op="ooredoo">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Ooredoo_Logo.svg" alt="Ooredoo">
                            <span>Ooredoo</span>
                        </div>
                    </div>
                    
                    <div class="form-group mt-3">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="flexy-phone" class="form-control" placeholder="مثال: 0770123456" maxlength="10" required>
                    </div>
                    
                    <div class="form-group">
                        <label>المبلغ (دج)</label>
                        <div class="amount-presets">
                            <button type="button" class="preset-btn" data-val="100">100</button>
                            <button type="button" class="preset-btn" data-val="200">200</button>
                            <button type="button" class="preset-btn" data-val="500">500</button>
                            <button type="button" class="preset-btn" data-val="1000">1000</button>
                        </div>
                        <input type="number" id="flexy-amount" class="form-control" placeholder="أدخل المبلغ (الأدنى 100)" min="100" required>
                    </div>

                    <button type="submit" class="btn-primary w-100 mt-2" id="btn-send-flexy">
                        إرسال الآن <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
                <div id="flexy-result" class="result-message"></div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="customer_script.js"></script>
</body>
</html>
